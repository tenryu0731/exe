<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EXE Launcher — Run Windows .exe in your browser</title>
<meta name="description" content="Run Windows .exe files in your browser on iPhone, Android, Mac or Chromebook — no install, no upload. Powered by Wine and Boxedwine (WebAssembly). ブラウザだけで Windows の exe を動かします。">
<meta property="og:title" content="EXE Launcher — Run Windows .exe in your browser">
<meta property="og:description" content="Run Windows .exe files in your browser on any device. No install, no upload.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tenryu0731.github.io/exe/">
<meta property="og:image" content="https://tenryu0731.github.io/exe/icon.svg">
<link rel="canonical" href="https://tenryu0731.github.io/exe/">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --sunken: #efefec;
    --text: #1b1c1e; --muted: #4a4d52; --faint: #63676d; --border: #d6d6d1; --rule: #e3e3de;
    --accent: #0b57d0; --accent-hover: #0a4bb4; --accent-text: #ffffff;
    --ok: #146c2e; --warn-bg: #fbf3dc; --warn: #6b4b00; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --surface: #1e2126; --sunken: #121417;
      --text: #e6e7e9; --muted: #b4b8bf; --faint: #9a9fa7; --border: #3a3e45; --rule: #2c3036;
      --accent: #8ab4f8; --accent-hover: #a8c7fa; --accent-text: #0f1a2e;
      --ok: #7fd18f; --warn-bg: #2c2615; --warn: #f0d58a; --danger: #f2a49c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --surface: #1e2126; --sunken: #121417;
    --text: #e6e7e9; --muted: #b4b8bf; --faint: #9a9fa7; --border: #3a3e45; --rule: #2c3036;
    --accent: #8ab4f8; --accent-hover: #a8c7fa; --accent-text: #0f1a2e;
    --ok: #7fd18f; --warn-bg: #2c2615; --warn: #f0d58a; --danger: #f2a49c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  button, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
  header.top .in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  #version { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header.top .spacer { flex: 1; }
  #lang { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 16px max(28px, env(safe-area-inset-bottom)); }
  .lede { color: var(--muted); margin: 0 0 16px; }
  section { margin: 0 0 22px; }
  h2 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

  /* 追加 */
  .add { padding: 14px; }
  body.dragging .add { border-color: var(--accent); border-style: dashed; }
  .add .hint { margin: 0 0 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn, #library button { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; padding: 8px 14px;
    min-height: 40px; font-weight: 600; cursor: pointer; }
  .btn:hover, #library button:hover { background: var(--sunken); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary, #library button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover, #library button.primary:hover { background: var(--accent-hover); }
  .btn.link { border-color: transparent; background: none; color: var(--accent); padding-left: 6px; padding-right: 6px; }
  #library button.danger { color: var(--danger); border-color: transparent; background: none; }
  #add-status { margin: 10px 0 0; }
  #add-status:empty { display: none; }
  #drop-overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45); }
  body.dragging #drop-overlay { display: flex; }
  #drop-overlay span { background: var(--surface); color: var(--text); border: 2px dashed var(--accent); padding: 16px 24px; border-radius: 6px; font-weight: 700; }

  .status { font-size: 13.5px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  progress { width: 100%; height: 6px; accent-color: var(--accent); margin-top: 8px; }
  .hint { font-size: 13px; color: var(--faint); margin: 6px 0 0; }

  /* ライブラリ */
  #library > .card { padding: 12px 14px; border-top: 1px solid var(--rule); }
  #library > .card:first-child { border-top: 0; }
  .game-title { font-weight: 700; word-break: break-all; line-height: 1.35; }
  .game-meta { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); margin-top: 2px; }
  .kind { font-size: 13px; color: var(--ok); margin-top: 4px; }
  .kind-no, .kind-hard { color: var(--warn); }
  #library .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #library .grow { flex: 0 1 auto; min-width: 120px; }
  label.field { display: block; font-size: 12.5px; color: var(--faint); margin: 10px 0 3px; }
  select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 7px 8px; min-height: 38px; }
  #library details > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; margin-top: 10px; }
  .ws-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  #library button.ws-file { min-height: 34px; padding: 6px 10px; font: 12.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: left; word-break: break-all; font-weight: 400; }
  .empty { color: var(--faint); font-size: 14px; padding: 14px; margin: 0; }

  /* エンジン */
  .engine { padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .engine .text { flex: 1 1 220px; min-width: 0; }
  .engine .text .status { margin: 0; }
  .engine-wrap progress { display: block; margin: 0; border-radius: 0; }
  [hidden] { display: none !important; }

  .note { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; margin: 0 0 22px; }
  details.acc { border-top: 1px solid var(--border); }
  details.acc:last-of-type { border-bottom: 1px solid var(--border); }
  details.acc > summary { cursor: pointer; padding: 11px 0; font-weight: 600; }
  details.acc .acc-body { padding: 0 0 12px; }
  ul.help { padding-left: 18px; margin: 0; font-size: 14px; color: var(--muted); }
  ul.help li { margin: 4px 0; }
  .faq { margin: 0; font-size: 14px; }
  .faq dt { font-weight: 600; margin-top: 10px; }
  .faq dt:first-child { margin-top: 0; }
  .faq dd { margin: 2px 0 0; color: var(--muted); }
  #changes h3 { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 12px 0 4px; color: var(--faint); }
  #changes h3:first-child { margin-top: 0; }
  #changes ul { color: var(--muted); }

  footer { color: var(--faint); font-size: 12.5px; margin-top: 24px; line-height: 1.7; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div id="drop-overlay"><span data-i18n="add.drop"></span></div>
  <header class="top">
    <div class="in">
      <span class="brand">EXE Launcher</span>
      <span id="version" data-i18n="version.loading"></span>
      <span class="spacer"></span>
      <button id="lang" data-i18n="lang.switch"></button>
    </div>
  </header>
  <main>
    <p class="lede" data-i18n="app.tagline"></p>

    <section>
      <h2 data-i18n="add.title"></h2>
      <div class="box add">
        <p class="hint" data-i18n="add.hint"></p>
        <input id="picker" type="file" multiple hidden>
        <input id="folder-picker" type="file" webkitdirectory multiple hidden>
        <div class="actions">
          <button class="btn primary" id="pick" data-i18n="add.files"></button>
          <button class="btn" id="pick-folder" data-i18n="add.folder"></button>
          <button class="btn link" id="demo" data-i18n="add.demo"></button>
        </div>
        <p id="add-status" class="status"></p>
      </div>
    </section>

    <section>
      <h2 data-i18n="lib.title"></h2>
      <div class="box" id="library"></div>
    </section>

    <section>
      <h2 data-i18n="engine.title"></h2>
      <div class="box engine-wrap">
        <div class="engine" id="engine">
          <div class="text"><p id="engine-status" class="status"></p></div>
          <button class="btn" id="prefetch"></button>
        </div>
        <progress id="engine-progress" hidden></progress>
      </div>
    </section>

    <div class="note" data-i18n="note.limits"></div>

    <details class="acc">
      <summary data-i18n="help.title"></summary>
      <div class="acc-body">
        <ul class="help">
          <li data-i18n="help.1"></li>
          <li data-i18n="help.2"></li>
          <li data-i18n="help.3"></li>
          <li data-i18n="help.4"></li>
          <li data-i18n="help.5"></li>
        </ul>
      </div>
    </details>
    <details class="acc">
      <summary data-i18n="faq.title"></summary>
      <div class="acc-body">
        <dl class="faq">
          <dt data-i18n="faq.q1"></dt><dd data-i18n="faq.a1"></dd>
          <dt data-i18n="faq.q2"></dt><dd data-i18n="faq.a2"></dd>
          <dt data-i18n="faq.q3"></dt><dd data-i18n="faq.a3"></dd>
          <dt data-i18n="faq.q4"></dt><dd data-i18n="faq.a4"></dd>
        </dl>
      </div>
    </details>
    <details class="acc" id="changes-box">
      <summary data-i18n="changes.title"></summary>
      <div class="acc-body"><div id="changes"></div></div>
    </details>

    <footer>
      <div data-i18n="footer.credits"></div>
      <div><a href="https://github.com/tenryu0731/exe" rel="noopener" data-i18n="footer.source"></a></div>
    </footer>
  </main>

<script src="i18n.js"></script>
<script src="zip.js"></script>
<script src="wine-saves.js"></script>
<script src="launcher.js"></script>
</body>
</html>
