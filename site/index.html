<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EXE Launcher — Run Windows .exe in your browser</title>
<meta name="description" content="Run Windows .exe files in your browser on iPhone, Android, Mac or Chromebook — no install, no upload. Powered by Wine and Boxedwine (WebAssembly). ブラウザだけで Windows の exe を動かします。">
<meta property="og:title" content="EXE Launcher — Run Windows .exe in your browser">
<meta property="og:description" content="Run Windows .exe files in your browser on any device. No install, no upload.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1f5fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --text: #15191e;
    --muted: #4d5865;
    --border: #cfd6de;
    --accent: #1f5fd1;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --ok: #1d6b36;
    --warn-bg: #fff4d6;
    --warn-text: #5a4300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101418;
      --panel: #1b2229;
      --text: #eef2f6;
      --muted: #a9b4c0;
      --border: #38434f;
      --accent: #5b8ff0;
      --accent-text: #0b1220;
      --danger: #ff8a80;
      --ok: #7fd49a;
      --warn-bg: #3a3000;
      --warn-text: #ffe28a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101418; --panel: #1b2229; --text: #eef2f6; --muted: #a9b4c0; --border: #38434f;
    --accent: #5b8ff0; --accent-text: #0b1220; --danger: #ff8a80; --ok: #7fd49a;
    --warn-bg: #3a3000; --warn-text: #ffe28a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  button, .btn, select {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 14px;
    min-height: 44px;
  }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .danger { color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 auto; min-width: 0; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  select { width: 100%; }
  #picker { display: none; }
  .status { font-size: 14px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .game-title { font-weight: 600; word-break: break-all; }
  .game-meta { font-size: 13px; color: var(--muted); }
  .kind { font-size: 13px; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--bg); color: var(--text); }
  .kind-no { background: var(--warn-bg); color: var(--warn-text); }
  .kind-hard { background: var(--warn-bg); color: var(--warn-text); }
  .note { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  #version { font-size: 13px; }
  #changes h3 { font-size: 14px; margin: 10px 0 2px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 8px; }
  ul.help { padding-left: 20px; margin: 6px 0; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
  progress { width: 100%; }
  header { display: flex; align-items: flex-start; gap: 8px; }
  header .grow { min-width: 0; }
  #lang { min-height: 36px; padding: 6px 10px; font-size: 14px; }
  #drop-overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(31, 95, 209, .18); border: 4px dashed var(--accent); font-size: 22px; font-weight: 700; color: var(--text); }
  body.dragging #drop-overlay { display: flex; }
  #drop-overlay span { background: var(--panel); padding: 12px 20px; border-radius: 12px; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
  <div id="drop-overlay"><span data-i18n="add.drop"></span></div>
  <header>
    <div class="grow">
      <h1>EXE Launcher</h1>
      <p class="sub"><span data-i18n="app.tagline"></span><br><span id="version" data-i18n="version.loading"></span></p>
    </div>
    <button id="lang" data-i18n="lang.switch"></button>
  </header>

  <div class="card">
    <h2 data-i18n="add.title"></h2>
    <p class="status" style="margin-top:0" data-i18n="add.hint"></p>
    <input id="picker" type="file" multiple hidden>
    <input id="folder-picker" type="file" webkitdirectory multiple hidden>
    <div class="row">
      <button class="primary" id="pick" data-i18n="add.files"></button>
      <button id="pick-folder" data-i18n="add.folder"></button>
      <button id="demo" data-i18n="add.demo"></button>
    </div>
    <p id="add-status" class="status"></p>
  </div>

  <div class="card">
    <h2 data-i18n="lib.title"></h2>
    <div id="library"></div>
  </div>

  <div class="card">
    <h2 data-i18n="engine.title"></h2>
    <p id="engine-status" class="status"></p>
    <progress id="engine-progress" hidden></progress>
    <div class="row" style="margin-top:8px">
      <button id="prefetch"></button>
    </div>
  </div>

  <div class="note" data-i18n="note.limits"></div>

  <details>
    <summary data-i18n="help.title"></summary>
    <ul class="help">
      <li data-i18n="help.1"></li>
      <li data-i18n="help.2"></li>
      <li data-i18n="help.3"></li>
      <li data-i18n="help.4"></li>
      <li data-i18n="help.5"></li>
    </ul>
  </details>

  <details id="changes-box">
    <summary data-i18n="changes.title"></summary>
    <div id="changes"></div>
  </details>

<script src="i18n.js"></script>
<script src="launcher.js"></script>
</body>
</html>
