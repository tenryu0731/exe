name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 上流 Boxedwine の固定コミット（更新する場合はここを書き換える）
  BOXEDWINE_COMMIT: 922848c4443012d0ed6b8acba581cc2ada6fe482
  EMSDK_VERSION: 6.0.10
  # 64bit エンジン（Boxedwine64 + wine64）の取得元 WindowsAppPlayer の固定コミット
  ENGINE64_COMMIT: 97c6294d84f7008fe8f96ab2ee686d7eab25b923
  # Wine 11 ファイルシステム（配布元で更新されることがあるため、ハッシュ固定ではなく内容を検査する）
  FS_URL: https://boxedwine.org/v2/11/TinyCore15Wine11.0.zip
  GOOGLE_FONTS_COMMIT: 9710da1eacb3be272583c3224dcb70f9da6eadbb
  KOSUGI_SHA256: f5e81d6a6b865d9b88c54d2d3c16bcaa3b239dfcefaf2a62976ac9dc7574bab7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # エンジン（Boxedwine）の入力が変わっていなければ、前回のビルド結果を再利用する
      - name: Restore engine build
        id: engine
        uses: actions/cache@v4
        with:
          path: engine-out
          key: engine-${{ env.BOXEDWINE_COMMIT }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/patch-shell.py', 'scripts/build-engines.sh') }}

      - name: Checkout Boxedwine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          git init boxedwine
          cd boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch --depth 1 origin "$BOXEDWINE_COMMIT"
          git checkout --quiet FETCH_HEAD

      - uses: mymindstorm/setup-emsdk@v14
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build engines
        if: steps.engine.outputs.cache-hit != 'true'
        run: scripts/build-engines.sh "$GITHUB_WORKSPACE/boxedwine" "$GITHUB_WORKSPACE/engine-out"

      - name: Download Wine filesystem
        run: |
          set -euo pipefail
          mkdir -p fs-download
          curl -fSL --connect-timeout 30 --max-time 600 --retry 5 --retry-all-errors --retry-delay 10 -o fs-download/boxedwine.zip "$FS_URL"
          python3 - <<'EOF'
          import hashlib, os, sys, zipfile
          path = "fs-download/boxedwine.zip"
          size = os.path.getsize(path)
          sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
          print(f"size={size} sha256={sha}")
          if size < 50_000_000:
              sys.exit("filesystem too small")
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              bad = z.testzip()
              if bad:
                  sys.exit(f"corrupt entry: {bad}")
          for needed in ("opt/wine/", "home/username/.wine/"):
              if not any(n.startswith(needed) for n in names):
                  sys.exit(f"missing {needed}")
          print(f"entries={len(names)} ok")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FS_SHA256={sha}\n")
          EOF

      - name: Prepare Wine filesystem
        run: |
          set -euo pipefail
          # .update-timestamp を UTC 解釈に合わせる（ファイルの削減は行わず完全版を配信。削減する場合は --prune）
          python3 scripts/prepare-filesystem.py fs-download/boxedwine.zip fs-download/fixed.zip
          mv fs-download/fixed.zip fs-download/boxedwine.zip
          # 日本語環境（ja_JP ロケールと、MS ゴシック等の名前で引ける Kosugi フォント）を追加
          pip install -q fonttools==4.66.1
          curl -fsSL --retry 5 -o fs-download/Kosugi-Regular.ttf "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/apache/kosugi/Kosugi-Regular.ttf"
          curl -fsSL --retry 5 -o fs-download/Kosugi-LICENSE.txt "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/apache/kosugi/LICENSE.txt"
          echo "$KOSUGI_SHA256  fs-download/Kosugi-Regular.ttf" | sha256sum -c -
          python3 scripts/add-japanese.py fs-download/Kosugi-Regular.ttf fs-download/Kosugi-LICENSE.txt fs-download/boxedwine.zip
          echo "FS_SHA256=$(sha256sum fs-download/boxedwine.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site _site

          mkdir -p _site/engine
          cp -r engine-out/jit engine-out/compat _site/engine/
          scripts/fetch-engine64.sh "$ENGINE64_COMMIT" _site/engine/64

          # GitHub Pages の 1 ファイル上限を避けるため 45MB ごとに分割（Service Worker が結合する）
          mkdir -p _site/fs
          split -b 45M -d -a 3 fs-download/boxedwine.zip _site/fs/boxedwine.zip.
          python3 - <<'EOF'
          import json, os
          parts = sorted(p for p in os.listdir("_site/fs") if p.startswith("boxedwine.zip."))
          json.dump({
              "sha256": os.environ["FS_SHA256"],
              "size": os.path.getsize("fs-download/boxedwine.zip"),
              "parts": parts,
          }, open("_site/fs/parts.json", "w"))
          EOF
          cat > _site/engine/BOXEDWINE_VERSION.txt <<EOF
          Boxedwine commit: $BOXEDWINE_COMMIT (https://github.com/danoon2/Boxedwine, GPL-2.0)
          Filesystem: $FS_URL (.update-timestamp patched) sha256=$FS_SHA256
          EOF
          printf '{"build": %s, "sha": "%s", "date": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:7}" "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" > _site/version.json
          cat _site/version.json
          touch _site/.nojekyll
          du -sh _site; ls -la _site _site/engine/* _site/fs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開物を実際のブラウザ（WebKit / Chromium）で動かして確認する。公開（deploy）は待たない。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Serve site
        run: |
          mkdir -p srv/exe
          tar -xf artifact/artifact.tar -C srv/exe
          (cd srv && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          curl -fsS -o /dev/null http://localhost:8765/exe/
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Build probe app
        run: |
          sudo apt-get install -y -q gcc-mingw-w64-i686 >/dev/null
          i686-w64-mingw32-gcc -O1 -o /tmp/probe.exe scripts/probe/probe.c -mwindows -lgdi32
          python3 scripts/probe/make-zip.py /tmp/probe.exe /tmp/probe.zip

      - name: Run E2E
        run: node scripts/e2e.mjs http://localhost:8765/exe/
