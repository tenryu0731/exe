name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 上流 Boxedwine の固定コミット（更新する場合はここを書き換える）
  BOXEDWINE_COMMIT: 922848c4443012d0ed6b8acba581cc2ada6fe482
  EMSDK_VERSION: 6.0.10
  # Wine 11 ファイルシステム（配布元で更新されることがあるため、ハッシュ固定ではなく内容を検査する）
  FS_URL: https://boxedwine.org/v2/11/TinyCore15Wine11.0.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # エンジン（Boxedwine）の入力が変わっていなければ、前回のビルド結果を再利用する
      - name: Restore engine build
        id: engine
        uses: actions/cache@v4
        with:
          path: engine-out
          key: engine-${{ env.BOXEDWINE_COMMIT }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/patch-shell.py', '.github/workflows/deploy.yml') }}

      - name: Checkout Boxedwine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          git init boxedwine
          cd boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch --depth 1 origin "$BOXEDWINE_COMMIT"
          git checkout --quiet FETCH_HEAD

      - uses: mymindstorm/setup-emsdk@v14
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Patch Boxedwine for mobile
        if: steps.engine.outputs.cache-hit != 'true'
        working-directory: boxedwine/project/emscripten
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-shell.py" .
          # 新しい emscripten では emcc でのリンク時に libc++ が入らないため em++ でリンクする
          sed -i 's/^\t@\$(CC) \$(ALL) -o \$@ \$(LDFLAGS)$/\t@$(CXX) $(ALL) -o $@ $(LDFLAGS)/' makefile
          grep -q '@$(CXX) $(ALL) -o' makefile

      - name: Build engines
        if: steps.engine.outputs.cache-hit != 'true'
        working-directory: boxedwine/project/emscripten
        run: |
          make jit
          make release
          for pair in jit:Jit compat:Release; do
            name="${pair%%:*}"; dir="${pair##*:}"
            mkdir -p "$GITHUB_WORKSPACE/engine-out/$name"
            cp Build/$dir/boxedwine.{html,js,wasm,css} Build/$dir/boxedwine-shell.js "$GITHUB_WORKSPACE/engine-out/$name/"
          done

      - name: Download Wine filesystem
        run: |
          set -euo pipefail
          mkdir -p fs-download
          curl -fSL --retry 5 -o fs-download/boxedwine.zip "$FS_URL"
          python3 - <<'EOF'
          import hashlib, os, sys, zipfile
          path = "fs-download/boxedwine.zip"
          size = os.path.getsize(path)
          sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
          print(f"size={size} sha256={sha}")
          if size < 50_000_000:
              sys.exit("filesystem too small")
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              bad = z.testzip()
              if bad:
                  sys.exit(f"corrupt entry: {bad}")
          for needed in ("opt/wine/", "home/username/.wine/"):
              if not any(n.startswith(needed) for n in names):
                  sys.exit(f"missing {needed}")
          print(f"entries={len(names)} ok")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FS_SHA256={sha}\n")
          EOF

      - name: Fix Wine prefix timestamp
        run: |
          set -euo pipefail
          # Boxedwine を ZIP 時刻 UTC 解釈に改変したので、.update-timestamp もそれに合わせる
          python3 scripts/fix-update-timestamp.py fs-download/boxedwine.zip fs-download/fixed.zip
          mv fs-download/fixed.zip fs-download/boxedwine.zip
          echo "FS_SHA256=$(sha256sum fs-download/boxedwine.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r site _site

          mkdir -p _site/engine
          cp -r engine-out/jit engine-out/compat _site/engine/

          # GitHub Pages の 1 ファイル上限を避けるため 45MB ごとに分割（Service Worker が結合する）
          mkdir -p _site/fs
          split -b 45M -d -a 3 fs-download/boxedwine.zip _site/fs/boxedwine.zip.
          python3 - <<'EOF'
          import json, os
          parts = sorted(p for p in os.listdir("_site/fs") if p.startswith("boxedwine.zip."))
          json.dump({
              "sha256": os.environ["FS_SHA256"],
              "size": os.path.getsize("fs-download/boxedwine.zip"),
              "parts": parts,
          }, open("_site/fs/parts.json", "w"))
          EOF
          cat > _site/engine/BOXEDWINE_VERSION.txt <<EOF
          Boxedwine commit: $BOXEDWINE_COMMIT (https://github.com/danoon2/Boxedwine, GPL-2.0)
          Filesystem: $FS_URL (.update-timestamp patched) sha256=$FS_SHA256
          EOF
          printf '{"build": %s, "sha": "%s", "date": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:7}" "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" > _site/version.json
          cat _site/version.json
          touch _site/.nojekyll
          du -sh _site; ls -la _site _site/engine/* _site/fs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
